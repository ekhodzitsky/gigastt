name: Publication hygiene

on:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: 'Full SHA of the ancestor to check commit metadata against'
        required: true
        type: string
      pull_request_number:
        description: 'Required for a branch run; checks the PR title, body and exact head SHA'
        required: false
        default: 0
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  public-content:
    runs-on: ubuntu-latest
    name: Public content
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Test publication guard
        run: python3 -m unittest discover -s scripts -p test_check_publication.py
      - name: Check content and publication metadata
        env:
          BASE_SHA: ${{ inputs.baseline_sha }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_SHA="$(python3 scripts/resolve-ci-baseline.py "$BASE_SHA")"
          python3 scripts/check-publication.py --commit-range "$BASE_SHA..HEAD"
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo 'A branch run requires its pull request number'; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '{pull_request: .}' > "$RUNNER_TEMP/publication-event.json"
            python3 - "$RUNNER_TEMP/publication-event.json" <<'PYCODE'
          import json, os, sys
          pr = json.load(open(sys.argv[1]))['pull_request']
          if pr['head']['sha'] != os.environ['GITHUB_SHA'] or pr['head']['repo']['full_name'] != os.environ['GITHUB_REPOSITORY']:
              sys.exit('Pull request does not match this checked-out source')
          PYCODE
            python3 scripts/check-publication.py --event-file "$RUNNER_TEMP/publication-event.json"
          fi
