# Rebuild from verified FP32 packaging sources; never recycle runtime downloads.
name: Release Model

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the validated, immutable model release after main CI passes'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  validate-model:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native prerequisites
        timeout-minutes: 8
        run: bash scripts/install-ci-prerequisites.sh
      - uses: Swatinem/rust-cache@v2
      - name: Build native binary and test gates
        run: |
          cargo build --release -p gigastt --locked
          python3 scripts/test-model-bundle.py
          python3 scripts/test-model-quality.py
      - name: Rebuild both heads from verified FP32 sources
        run: python3 scripts/prepare-model-bundle.py --binary target/release/gigastt --root "$RUNNER_TEMP/model-bundle"
      - name: Prepare frozen public long-form audio
        run: python3 scripts/longform_stitch.py prepare --audio "$RUNNER_TEMP/audio"
      - name: Require quality and performance non-regression for both heads
        run: |
          for head in rnnt e2e_rnnt; do
            python3 scripts/model-quality.py \
              --binary target/release/gigastt --head "$head" \
              --baseline "$RUNNER_TEMP/model-bundle/baseline/$head" \
              --candidate "$RUNNER_TEMP/model-bundle/candidate/$head" \
              --audio "$RUNNER_TEMP/audio" --output "$RUNNER_TEMP/reports/$head"
          done
      - name: Preserve raw quality and resource evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-quality-evidence
          path: |
            ${{ runner.temp }}/reports/**/*.json
            ${{ runner.temp }}/reports/**/*.log
            ${{ runner.temp }}/reports/**/*.time
          if-no-files-found: warn
      - name: Preserve verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: verified-model-bundle
          path: ${{ runner.temp }}/model-bundle/dist/
          if-no-files-found: error

  publish-model:
    needs: validate-model
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - name: Require successful main CI for this exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/performance-gates.py release "$GITHUB_SHA"
      - uses: actions/download-artifact@v4
        with:
          name: verified-model-bundle
          path: dist
      - name: Verify bundle and resolve reviewed tag
        id: model
        run: |
          (cd dist && sha256sum --check SHA256SUMS.txt)
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          tag = json.loads(Path('benchmark/model-release.json').read_text())['tag']
          if not re.fullmatch(r'models-v3-\d{4}-\d{2}-\d{2}', tag):
              raise ValueError('invalid model tag')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'tag={tag}\n')
          PY
      - name: Sign verified bundle when configured
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          if [ -n "$MINISIGN_SECRET_KEY" ]; then
            timeout --kill-after=10s 120s sudo apt-get install -y --no-install-recommends minisign
            key="$RUNNER_TEMP/model-signing.key"
            trap 'rm -f "$key"' EXIT
            umask 077
            printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
            for file in dist/*.onnx dist/*.txt; do
              printf '%s\n' "$MINISIGN_PASSWORD" | minisign -Sm "$file" -s "$key"
            done
          fi
      - name: Publish a new immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_TAG: ${{ steps.model.outputs.tag }}
        run: |
          existing=$(git ls-remote --tags origin "refs/tags/$MODEL_TAG")
          test -z "$existing" || { echo 'Refusing to replace an existing model tag'; exit 1; }
          gh release create "$MODEL_TAG" dist/* \
            --target "$GITHUB_SHA" --latest=false \
            --title "GigaAM v3 INT8 model ($MODEL_TAG)" \
            --notes-file docs/rnnt-quantization.md
